# /etc/nginx/sites-available/clau-backend
#
# SETUP:
#   1. Install nginx:  sudo apt install nginx
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Copy this file to /etc/nginx/sites-available/clau-backend
#   4. Replace YOUR_DOMAIN with your actual domain (e.g. api.clau.app)
#   5. sudo ln -s /etc/nginx/sites-available/clau-backend /etc/nginx/sites-enabled/
#   6. sudo nginx -t && sudo systemctl reload nginx
#   7. sudo certbot --nginx -d YOUR_DOMAIN   (auto-patches SSL blocks below)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot will redirect HTTP → HTTPS here automatically.
    # Until certbot runs, this block serves the ACME challenge for cert issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # --- SSL (filled in by certbot, do not edit manually) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header X-Frame-Options           DENY                                           always;

    # --- Proxy to FastAPI ---
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- WebSocket upgrade for /ws/prices ---
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }
}
